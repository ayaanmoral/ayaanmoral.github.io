 <head>

 <style>

 div {

 }

 }

 }


 .bottom-container {

 margin-top: 20px;
 }
 #p5-container {
 float: left;
 width: 620px;

 height: auto;
 }

 float: left;

 height: 600px;
 padding: 20px;

 font-family: sans-serif;
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 }
 </style>
 </head>
 <body>


 <main id="defaultBlock">
 <h2>Main Page Title</h2>



 <div id="block1">
 <h2>Calendar</h2>
 <iframe src="https://calendar.google.com/calendar/embed?src=350433811%40tdsb.ca&ctz=America%2FToronto" style="border: 0" width="475" height="590" frameborder="0" scrolling="no"></iframe>

 </script>

 <div class="bottom-container">
   <div id="p5-container">
     <h2>P5.js Animation</h2>
   </div>

   <div id="link-container">
     <h3>Warning: Extreme Boredom Ahead!</h3>
     <p>If you have zero things to do and want to waste your time in the best way possible, click the button below.</p>
     <br>
     <a href="https://theuselessweb.com/" target="_blank" style="font-size: 18px; font-weight: bold; background-color: #ff4757; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px;">Click at your own risk 🚀</a>
   </div>
 </div>


 <script>
 let lastX = 0;
 let lastY = 0;

 function setup() {
   let canvas = createCanvas(600, 600);
   canvas.parent('p5-container');
   background("black");
   stroke("green");
 }

 function draw() {
   strokeWeight(0.1);
   for (let i = 0; i < 100; i++) {
     let mapX = map(lastX, -2.182, 2.6558, 600, 0);
     let mapY = map(lastY, 0, 9.9983, 600, 0);
     point(mapX, mapY);
     
     let num = random(0, 100);
     let x, y;
     
     if (num < 1) {
       x = 0;
       y = 0.16 * lastY;
     } else if (num <= 7) {
       x = -0.15 * lastX + 0.28 * lastY;
       y = 0.26 * lastX + 0.24 * lastY + 0.44;
     } else if (num <= 14) {
       x = 0.2 * lastX - 0.26 * lastY;
       y = 0.2 * lastX + 0.22 * lastY + 1.6;
     } else {
       x = 0.85 * lastX + 0.04 * lastY;
       y = -0.04 * lastX + 0.85 * lastY + 1.6;
     }
     
     lastX = x;
     lastY = y;
   }
 }
 </script>

 </body>
